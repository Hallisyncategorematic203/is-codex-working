name: Feature request
description: Suggest a focused improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Keep the core goal narrow: quickly and reliably answer “Is Codex actually working?”
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem are you trying to solve?
      placeholder: I keep needing to...
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed improvement
      placeholder: A simple way to solve it would be...
    validations:
      required: true
  - type: textarea
    id: simpler
    attributes:
      label: Simpler alternative
      description: Is there a smaller change that solves most of the problem?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This keeps the app local/read-only and does not require telemetry or log uploads.
          required: true
