name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for detached-job stress test
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build production and tests
        shell: cmd
        run: BUILD.bat --with-tests

      - name: Run regression tests
        shell: pwsh
        run: |
          $testDir = (Get-Content "bin\CURRENT_TEST_BUILD.txt" -Raw).Trim()
          $exe = Join-Path $testDir "IsCodexWorking.Tests.exe"
          if (-not (Test-Path $exe)) { throw "Test executable not found: $exe" }
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run integration stress tests
        shell: pwsh
        run: |
          $testDir = (Get-Content "bin\CURRENT_TEST_BUILD.txt" -Raw).Trim()
          $exe = Join-Path $testDir "IsCodexWorking.Tests.exe"
          & $exe --stress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
